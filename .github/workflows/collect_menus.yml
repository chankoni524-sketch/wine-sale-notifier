name: 期間限定メニュー情報の自動収集

on:
  schedule:
    - cron: "30 23 * * *"  # 日本時間 毎朝8:30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 検索してLINEに通知
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python scripts/collect_menus.py

      - name: 更新されたデータをリポジトリに保存
        run: |
          git config user.name "wine-sale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/menus.json
          git diff --cached --quiet || git commit -m "メニュー情報を更新"
          git push
